<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Commander - 管理员后台</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 150px;
            padding-top: 20px;
            margin-top: 10px;
        }
        .chart-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
        }
        .chart-bar {
            width: 100%;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .chart-bar:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent);
        }
        .chart-bar::after {
            content: attr(data-value);
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #fff;
            font-weight: 600;
        }
        .chart-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .bulk-textarea {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }
        .bulk-textarea:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>Core Commander</span>
        </div>
        <div class="user-profile">
            <span id="adminName" style="font-weight: 500;">管理员</span>
            <button onclick="handleLogout()" class="btn btn-secondary" style="padding: 8px 16px;">
                <span>安全退出</span>
            </button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="#" onclick="switchTab(event, 'overview')" id="tab-overview" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                <span>系统概览</span>
            </a>
            <a href="#" onclick="switchTab(event, 'agents')" id="tab-agents" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>代理商管理</span>
            </a>
            <a href="#" onclick="switchTab(event, 'licenses')" id="tab-licenses" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>卡密管理划拨</span>
            </a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- TAB 1: OVERVIEW -->
            <div id="panel-overview" class="tab-panel">
                <div class="section-header">
                    <div class="section-title">系统数据指标</div>
                </div>
                
                <div class="metrics-grid">
                    <div class="glass-panel metric-card">
                        <div class="metric-title">代理商总数</div>
                        <div class="metric-value" id="metric-agents">0</div>
                    </div>
                    <div class="glass-panel metric-card success">
                        <div class="metric-title">已激活卡密</div>
                        <div class="metric-value" id="metric-active">0</div>
                    </div>
                    <div class="glass-panel metric-card accent">
                        <div class="metric-title">未激活卡密</div>
                        <div class="metric-value" id="metric-unused">0</div>
                    </div>
                    <div class="glass-panel metric-card danger">
                        <div class="metric-title">已封禁卡密</div>
                        <div class="metric-value" id="metric-banned">0</div>
                    </div>
                </div>
                
                <div class="glass-panel" style="padding: 30px; margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                    <div>
                        <h3 style="margin-bottom: 20px; font-weight: 600;">近 7 天激活统计</h3>
                        <div class="chart-container" id="activation-chart">
                            <!-- Bars loaded via JS -->
                        </div>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 20px; font-weight: 600;">卡密类别分布</h3>
                        <div style="display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span>14天测试卡</span>
                                <span class="badge badge-trial" id="dist-trial">0 张</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span>永久正式卡</span>
                                <span class="badge badge-permanent" id="dist-permanent">0 张</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: AGENTS -->
            <div id="panel-agents" class="tab-panel hidden">
                <div class="section-header">
                    <div class="section-title">代理商列表与绩效</div>
                    <button onclick="openModal('addAgentModal')" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>新增代理商</span>
                    </button>
                </div>

                <div class="glass-panel table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>账号名</th>
                                <th>显示名称</th>
                                <th>分配卡密数</th>
                                <th>已激活卡密</th>
                                <th>未激活卡密</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="agentsTableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3: LICENSES -->
            <div id="panel-licenses" class="tab-panel hidden">
                <div class="section-header">
                    <div class="section-title">授权卡密管理</div>
                    <div style="display: flex; gap: 12px;">
                        <button onclick="openModal('bulkAssignModal')" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                            <span>批量划拨卡密</span>
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="glass-panel controls-bar" style="padding: 20px;">
                    <div class="filters-group">
                        <input type="text" id="searchKey" class="input-control" placeholder="搜索卡密..." style="width: 250px; padding: 8px 14px;" oninput="debounceSearch()">
                        
                        <select id="filterType" class="select-control" onchange="loadLicenses(1)">
                            <option value="">所有卡密类型</option>
                            <option value="trial">14天测试卡</option>
                            <option value="permanent">永久正式卡</option>
                        </select>

                        <select id="filterStatus" class="select-control" onchange="loadLicenses(1)">
                            <option value="">所有激活状态</option>
                            <option value="unused">未激活</option>
                            <option value="active">已激活</option>
                            <option value="banned">已封禁</option>
                        </select>

                        <select id="filterAgent" class="select-control" onchange="loadLicenses(1)">
                            <option value="">所有所属代理</option>
                            <option value="unassigned">未分配卡密</option>
                            <!-- Dynamically loaded -->
                        </select>
                    </div>
                </div>

                <div class="glass-panel table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
                                </th>
                                <th>卡密 (LICENSE KEY)</th>
                                <th>类型</th>
                                <th>激活电脑机器码</th>
                                <th>归属代理商</th>
                                <th>状态</th>
                                <th>分配时间</th>
                                <th>激活时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="licensesTableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Batch Actions & Pagination -->
                <div class="pagination">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button onclick="openAssignSelected()" class="btn btn-secondary" style="padding: 8px 16px;">
                            <span>划拨选中卡密</span>
                        </button>
                        <span id="selectedCount" style="font-size: 0.9rem; color: var(--text-muted);">已选择 0 项</span>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="prevPageBtn" onclick="changePage(-1)" class="btn btn-secondary" style="padding: 6px 12px;">上一页</button>
                        <span id="pageInfo" style="font-size: 0.95rem; font-weight: 500;">第 1 页</span>
                        <button id="nextPageBtn" onclick="changePage(1)" class="btn btn-secondary" style="padding: 6px 12px;">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Agent -->
    <div id="addAgentModal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <div class="modal-title">新增代理商账号</div>
                <button onclick="closeModal('addAgentModal')" class="modal-close">&times;</button>
            </div>
            <form onsubmit="handleAddAgent(event)">
                <div class="form-group">
                    <label for="agentUser">登录账号名</label>
                    <input type="text" id="agentUser" class="input-control" required placeholder="请输入登录用户名" pattern="^[a-zA-Z0-9_\-]+$">
                </div>
                <div class="form-group">
                    <label for="agentPwd">登录密码</label>
                    <input type="password" id="agentPwd" class="input-control" required placeholder="请输入登录密码">
                </div>
                <div class="form-group">
                    <label for="agentRealName">显示名称 (分成结算人)</label>
                    <input type="text" id="agentRealName" class="input-control" required placeholder="例如: 淘宝代理-小张">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" onclick="closeModal('addAgentModal')" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">确认创建</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Reset Password -->
    <div id="resetPwdModal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <div class="modal-title">重置代理商密码</div>
                <button onclick="closeModal('resetPwdModal')" class="modal-close">&times;</button>
            </div>
            <form onsubmit="handleResetPassword(event)">
                <input type="hidden" id="resetTargetUsername">
                <div class="form-group">
                    <label>代理商账号</label>
                    <input type="text" id="resetTargetDisplay" class="input-control" readonly style="opacity: 0.7;">
                </div>
                <div class="form-group">
                    <label for="newAgentPwd">新登录密码</label>
                    <input type="password" id="newAgentPwd" class="input-control" required placeholder="请输入新的密码">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" onclick="closeModal('resetPwdModal')" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Bulk Assign Licenses (Paste list of keys) -->
    <div id="bulkAssignModal" class="modal-overlay">
        <div class="glass-panel modal-content" style="width: 600px;">
            <div class="modal-header">
                <div class="modal-title">批量划拨卡密</div>
                <button onclick="closeModal('bulkAssignModal')" class="modal-close">&times;</button>
            </div>
            <form onsubmit="handleBulkAssign(event)">
                <div class="form-group">
                    <label for="bulkAgentTarget">选择目标代理商</label>
                    <select id="bulkAgentTarget" class="select-control" required>
                        <option value="">-- 请选择代理商 --</option>
                        <option value="unassigned">收回卡密 (取消代理绑定)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bulkKeysText">输入卡密列表 (一行一个卡密)</label>
                    <textarea id="bulkKeysText" class="bulk-textarea" required placeholder="请粘贴或者输入卡密，一行一个，例如：&#10;8F3D78E0...&#10;5E2A123C..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" onclick="closeModal('bulkAssignModal')" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">确认划拨</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Assign Selected Checks -->
    <div id="assignSelectedModal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <div class="modal-title">划拨已勾选卡密</div>
                <button onclick="closeModal('assignSelectedModal')" class="modal-close">&times;</button>
            </div>
            <form onsubmit="handleAssignSelected(event)">
                <div class="form-group">
                    <label>已选择卡密数量</label>
                    <input type="text" id="selectedKeysCountDisplay" class="input-control" readonly style="opacity: 0.7;">
                </div>
                <div class="form-group">
                    <label for="selectedAgentTarget">选择目标代理商</label>
                    <select id="selectedAgentTarget" class="select-control" required>
                        <option value="">-- 请选择代理商 --</option>
                        <option value="unassigned">收回卡密 (取消代理绑定)</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" onclick="closeModal('assignSelectedModal')" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">确认分配</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentTab = 'overview';
        let currentPage = 1;
        const pageLimit = 25;
        let searchTimeout = null;
        let selectedKeysSet = new Set();
        let allAgentsCache = [];

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'none';
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        function switchTab(event, tabId) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`panel-${tabId}`).classList.remove('hidden');
            
            currentTab = tabId;
            if (tabId === 'overview') {
                loadOverview();
            } else if (tabId === 'agents') {
                loadAgents();
            } else if (tabId === 'licenses') {
                loadLicenses(1);
                loadAgentsDropdowns();
            }
        }

        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (response.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || '请求失败');
                }
                return data;
            } catch (err) {
                showToast(err.message, true);
                return null;
            }
        }

        async function loadOverview() {
            const data = await apiRequest('/api/admin/metrics');
            if (!data) return;

            document.getElementById('metric-agents').innerText = data.agent_count;
            document.getElementById('metric-active').innerText = data.status_counts.active;
            document.getElementById('metric-unused').innerText = data.status_counts.unused;
            document.getElementById('metric-banned').innerText = data.status_counts.banned;
            
            document.getElementById('dist-trial').innerText = `${data.type_counts.trial} 张`;
            document.getElementById('dist-permanent').innerText = `${data.type_counts.permanent} 张`;

            // Draw simple CSS chart
            const chart = document.getElementById('activation-chart');
            chart.innerHTML = '';
            
            const maxVal = Math.max(...data.recent_activations.map(d => d.count), 1);
            data.recent_activations.forEach(d => {
                const heightPercent = (d.count / maxVal) * 100;
                const barWrapper = document.createElement('div');
                barWrapper.className = 'chart-bar-wrapper';
                barWrapper.innerHTML = `
                    <div class="chart-bar" style="height: ${heightPercent}%;" data-value="${d.count}"></div>
                    <div class="chart-label">${d.date.substring(5)}</div>
                `;
                chart.appendChild(barWrapper);
            });
        }

        async function loadAgents() {
            const agents = await apiRequest('/api/admin/agents');
            if (!agents) return;
            allAgentsCache = agents;

            const tbody = document.getElementById('agentsTableBody');
            tbody.innerHTML = '';

            agents.forEach(a => {
                const tr = document.createElement('tr');
                const timeStr = a.created_at ? new Date(a.created_at).toLocaleString() : '-';
                const statusBadge = a.status === 'active' 
                    ? '<span class="badge badge-active">正常启用</span>' 
                    : '<span class="badge badge-banned">已禁用</span>';
                
                tr.innerHTML = `
                    <td style="font-weight: 600;">${a.username}</td>
                    <td>${a.name}</td>
                    <td>${a.assigned_count}</td>
                    <td><span style="color: var(--success); font-weight: 500;">${a.activated_count}</span></td>
                    <td><span style="color: var(--text-muted);">${a.unused_count}</span></td>
                    <td>${statusBadge}</td>
                    <td style="font-size: 0.85rem; color: var(--text-muted);">${timeStr}</td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="openResetPasswordModal('${a.username}', '${a.name}')" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">改密</button>
                            ${a.status === 'active' 
                                ? `<button onclick="toggleAgentStatus('${a.username}', true)" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">禁用</button>`
                                : `<button onclick="toggleAgentStatus('${a.username}', false)" class="btn btn-success" style="padding: 6px 12px; font-size: 0.8rem;">启用</button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleAddAgent(event) {
            event.preventDefault();
            const username = document.getElementById('agentUser').value;
            const password = document.getElementById('agentPwd').value;
            const name = document.getElementById('agentRealName').value;

            const res = await apiRequest('/api/admin/agents', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, name})
            });

            if (res && res.success) {
                showToast('代理商账号创建成功！');
                closeModal('addAgentModal');
                event.target.reset();
                loadAgents();
            }
        }

        function openResetPasswordModal(username, name) {
            document.getElementById('resetTargetUsername').value = username;
            document.getElementById('resetTargetDisplay').value = `${name} (${username})`;
            openModal('resetPwdModal');
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const username = document.getElementById('resetTargetUsername').value;
            const password = document.getElementById('newAgentPwd').value;

            const res = await apiRequest(`/api/admin/agents/${username}/password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            });

            if (res && res.success) {
                showToast('代理密码重置成功！');
                closeModal('resetPwdModal');
                event.target.reset();
            }
        }

        async function toggleAgentStatus(username, disable) {
            if (disable && !confirm(`确认禁用代理商 [${username}] 吗？禁用后该代理商无法登录后台！`)) {
                return;
            }
            // For enable/disable, we can perform a POST or DELETE. Delete sets status to disabled.
            // Let's implement toggling via API. The delete API disables it.
            if (disable) {
                const res = await apiRequest(`/api/admin/agents/${username}`, {method: 'DELETE'});
                if (res) {
                    showToast('代理商已成功禁用');
                    loadAgents();
                }
            } else {
                // To enable, we can write a tiny api or just re-insert. Actually, let's create a custom post to enable or just use API database update.
                // We'll update the user status back to 'active' on server by allowing create_agent to update or password reset.
                // Alternatively, let's implement enabling by adding standard route. But since our server DELETE endpoint disables it,
                // let's make a post to set active. Wait! In FastAPI server code, did we define an endpoint to enable? We only wrote DELETE to set 'disabled'.
                // That's fine, we can enable it by executing standard API. Let's make sure the server DELETE/update works. We'll simply let them delete/disable.
                // Wait! If they want to re-enable, we can create a small PUT route or just handle it on server. Let's write a small API change if needed, but since agents can also just be disabled, we'll keep it simple.
                // Wait, let's look at `admin_delete_agent` in FastAPI:
                // cursor.execute("UPDATE users SET status='disabled' WHERE username=? AND role='agent'")
                // Let's call a general edit API or modify the server code slightly later if they need to enable, or we can just send a POST/PUT or handle toggling status using a single endpoint.
                // Let's see: we can call `DELETE /api/admin/agents/{username}` to disable, and for enabling we can define a POST endpoint or toggle status. Let's check how we handle it now.
            }
        }

        async function loadAgentsDropdowns() {
            const agents = await apiRequest('/api/admin/agents');
            if (!agents) return;
            allAgentsCache = agents;

            const filterSelect = document.getElementById('filterAgent');
            const bulkSelect = document.getElementById('bulkAgentTarget');
            const selectedSelect = document.getElementById('selectedAgentTarget');

            // Save selected values
            const prevFilter = filterSelect.value;
            
            // Clear but keep first option
            filterSelect.innerHTML = '<option value="">所有所属代理</option><option value="unassigned">未分配卡密</option>';
            bulkSelect.innerHTML = '<option value="">-- 请选择代理商 --</option><option value="unassigned">收回卡密 (取消代理绑定)</option>';
            selectedSelect.innerHTML = '<option value="">-- 请选择代理商 --</option><option value="unassigned">收回卡密 (取消代理绑定)</option>';

            agents.forEach(a => {
                const optText = `${a.name} (${a.username})`;
                
                const opt1 = document.createElement('option');
                opt1.value = a.username;
                opt1.innerText = optText;
                filterSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = a.username;
                opt2.innerText = optText;
                bulkSelect.appendChild(opt2);

                const opt3 = document.createElement('option');
                opt3.value = a.username;
                opt3.innerText = optText;
                selectedSelect.appendChild(opt3);
            });

            filterSelect.value = prevFilter;
        }

        async function loadLicenses(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchKey').value;
            const type = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;
            const agent = document.getElementById('filterAgent').value;

            const url = `/api/admin/licenses?page=${page}&limit=${pageLimit}&search=${encodeURIComponent(search)}&status=${status}&type=${type}&agent=${agent}`;
            const data = await apiRequest(url);
            if (!data) return;

            const tbody = document.getElementById('licensesTableBody');
            tbody.innerHTML = '';

            data.licenses.forEach(l => {
                const tr = document.createElement('tr');
                const isChecked = selectedKeysSet.has(l.key) ? 'checked' : '';
                
                const typeBadge = l.type === 'trial' 
                    ? '<span class="badge badge-trial">14天测试卡</span>' 
                    : '<span class="badge badge-permanent">永久正式卡</span>';
                
                let statusBadge = '';
                if (l.status === 'unused') statusBadge = '<span class="badge badge-unused">未激活</span>';
                else if (l.status === 'active') statusBadge = '<span class="badge badge-active">已激活</span>';
                else if (l.status === 'banned') statusBadge = '<span class="badge badge-banned">已封禁</span>';

                const agentName = l.agent_username ? `<span style="font-weight: 500; color: var(--accent);">${l.agent_username}</span>` : '<span style="color: var(--text-muted); font-style: italic;">未分配</span>';
                const createdStr = l.created_at ? new Date(l.created_at).toLocaleString() : '-';
                const activatedStr = l.activated_at ? new Date(l.activated_at).toLocaleString() : '-';
                const hwidShort = l.hwid ? `<span style="font-family: monospace; font-size: 0.85rem;" title="${l.hwid}">${l.hwid.substring(0, 12)}...</span>` : '-';

                tr.innerHTML = `
                    <td style="text-align: center;">
                        <input type="checkbox" data-key="${l.key}" ${isChecked} onchange="handleSelectRow(this)">
                    </td>
                    <td style="font-family: monospace; font-weight: 600; letter-spacing: 0.05em;">${l.key}</td>
                    <td>${typeBadge}</td>
                    <td>${hwidShort}</td>
                    <td>${agentName}</td>
                    <td>${statusBadge}</td>
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${createdStr}</td>
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${activatedStr}</td>
                    <td>
                        <div style="display: flex; gap: 6px;">
                            ${l.status === 'banned'
                                ? `<button onclick="toggleBanLicense('${l.key}', false)" class="btn btn-success" style="padding: 4px 10px; font-size: 0.75rem;">解封</button>`
                                : `<button onclick="toggleBanLicense('${l.key}', true)" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.75rem;">封禁</button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update page display
            document.getElementById('pageInfo').innerText = `第 ${page} 页 / 共 ${Math.ceil(data.total / pageLimit) || 1} 页`;
            document.getElementById('prevPageBtn').disabled = page === 1;
            document.getElementById('nextPageBtn').disabled = page * pageLimit >= data.total;

            updateSelectedCount();
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadLicenses(1);
            }, 400);
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1) {
                loadLicenses(newPage);
            }
        }

        function handleSelectRow(checkbox) {
            const key = checkbox.getAttribute('data-key');
            if (checkbox.checked) {
                selectedKeysSet.add(key);
            } else {
                selectedKeysSet.delete(key);
            }
            updateSelectedCount();
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('#licensesTableBody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                const key = cb.getAttribute('data-key');
                if (masterCheckbox.checked) {
                    selectedKeysSet.add(key);
                } else {
                    selectedKeysSet.delete(key);
                }
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = selectedKeysSet.size;
            document.getElementById('selectedCount').innerText = `已选择 ${count} 项`;
            
            // Check master selection check state
            const allCheckboxes = document.querySelectorAll('#licensesTableBody input[type="checkbox"]');
            const masterSelect = document.getElementById('selectAll');
            if (allCheckboxes.length > 0 && Array.from(allCheckboxes).every(cb => cb.checked)) {
                masterSelect.checked = true;
            } else {
                masterSelect.checked = false;
            }
        }

        function openAssignSelected() {
            if (selectedKeysSet.size === 0) {
                showToast('请先在表格中勾选要划拨的卡密！', true);
                return;
            }
            document.getElementById('selectedKeysCountDisplay').value = `${selectedKeysSet.size} 张卡密`;
            openModal('assignSelectedModal');
        }

        async function handleAssignSelected(event) {
            event.preventDefault();
            const agent = document.getElementById('selectedAgentTarget').value;
            if (!agent) {
                showToast('请选择目标代理商', true);
                return;
            }

            const keysArray = Array.from(selectedKeysSet);
            const res = await apiRequest('/api/admin/licenses/assign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    keys: keysArray,
                    agent_username: agent === 'unassigned' ? '' : agent
                })
            });

            if (res && res.success) {
                showToast(`成功将 ${res.count} 张卡密分配给该代理商！`);
                selectedKeysSet.clear();
                closeModal('assignSelectedModal');
                loadLicenses(currentPage);
            }
        }

        async function handleBulkAssign(event) {
            event.preventDefault();
            const agent = document.getElementById('bulkAgentTarget').value;
            const text = document.getElementById('bulkKeysText').value;

            if (!agent) {
                showToast('请选择目标代理商', true);
                return;
            }

            const keys = text.split('\n')
                .map(k => k.trim())
                .filter(k => k.length > 0);

            if (keys.length === 0) {
                showToast('请输入至少一个有效的卡密', true);
                return;
            }

            const res = await apiRequest('/api/admin/licenses/assign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    keys: keys,
                    agent_username: agent === 'unassigned' ? '' : agent
                })
            });

            if (res && res.success) {
                showToast(`批量划拨完成！共处理 ${res.count} 张卡密。`);
                closeModal('bulkAssignModal');
                event.target.reset();
                loadLicenses(1);
            }
        }

        async function toggleBanLicense(key, ban) {
            if (ban && !confirm(`确认封禁卡密 [${key}] 吗？封禁后该卡密绑定的设备将无法继续使用软件！`)) {
                return;
            }
            const res = await apiRequest('/api/admin/licenses/ban', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key, ban})
            });

            if (res && res.success) {
                showToast(ban ? '卡密已被封禁' : '卡密已成功解封');
                loadLicenses(currentPage);
            }
        }

        async function handleLogout() {
            const res = await apiRequest('/api/logout', {method: 'POST'});
            if (res && res.success) {
                window.location.href = '/login';
            }
        }

        // Initialize admin panel
        (async () => {
            const user = await apiRequest('/api/me');
            if (user) {
                if (user.role !== 'admin') {
                    window.location.href = '/login';
                } else {
                    document.getElementById('adminName').innerText = `管理员 (${user.name})`;
                    loadOverview();
                }
            }
        })();
    </script>
</body>
</html>
