<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Commander - 授权系统登录</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b162b 0%, #07060a 100%);
        }
        .login-card {
            width: 420px;
            max-width: 90%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }
        .login-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: -20px;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-card">
        <div class="login-title">Core Commander</div>
        <div class="login-desc">卡密授权系统后台</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" class="input-control" required placeholder="请输入您的账号" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" class="input-control" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                <span>安全登录</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            </button>
        </form>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'none';
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });
                
                const data = await response.json();
                if (response.ok && data.success) {
                    showToast('登录成功，正在跳转...', false);
                    setTimeout(() => {
                        if (data.role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/agent';
                        }
                    }, 1000);
                } else {
                    showToast(data.detail || '登录失败，请检查用户名和密码', true);
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                }
            } catch (error) {
                showToast('网络连接失败，请检查服务器运行状态', true);
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        }

        // Auto login check
        (async () => {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const user = await res.json();
                    if (user.role === 'admin') {
                        window.location.href = '/admin';
                    } else if (user.role === 'agent') {
                        window.location.href = '/agent';
                    }
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
