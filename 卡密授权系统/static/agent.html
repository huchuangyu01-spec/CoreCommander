<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Commander - 代理商后台</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .export-textarea {
            width: 100%;
            height: 250px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            color: var(--accent);
            font-family: monospace;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>Core Commander</span>
        </div>
        <div class="user-profile">
            <span id="agentName" style="font-weight: 500; color: var(--accent);">代理商</span>
            <button onclick="handleLogout()" class="btn btn-secondary" style="padding: 8px 16px;">
                <span>安全退出</span>
            </button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="#" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>我的卡密</span>
            </a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Metrics -->
            <div class="metrics-grid">
                <div class="glass-panel metric-card accent">
                    <div class="metric-title">已分配卡密数</div>
                    <div class="metric-value" id="metric-total">0</div>
                </div>
                <div class="glass-panel metric-card success">
                    <div class="metric-title">已激活卡密</div>
                    <div class="metric-value" id="metric-active">0</div>
                </div>
                <div class="glass-panel metric-card">
                    <div class="metric-title">未激活卡密 (库存)</div>
                    <div class="metric-value" id="metric-unused">0</div>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="section-header" style="margin-top: 20px;">
                <div class="section-title">我的卡密列表</div>
                <button onclick="openExportModal()" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                    <span>导出未激活卡密</span>
                </button>
            </div>

            <!-- Filters -->
            <div class="glass-panel controls-bar" style="padding: 20px;">
                <div class="filters-group">
                    <input type="text" id="searchKey" class="input-control" placeholder="搜索卡密..." style="width: 300px; padding: 8px 14px;" oninput="debounceSearch()">
                    
                    <select id="filterStatus" class="select-control" onchange="loadLicenses(1)">
                        <option value="">所有激活状态</option>
                        <option value="unused">未激活 (库存)</option>
                        <option value="active">已激活</option>
                        <option value="banned">已封禁</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="glass-panel table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>卡密 (LICENSE KEY)</th>
                            <th>类型</th>
                            <th>激活电脑机器码 (HWID)</th>
                            <th>状态</th>
                            <th>分配时间</th>
                            <th>激活时间</th>
                        </tr>
                    </thead>
                    <tbody id="licensesTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div></div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button id="prevPageBtn" onclick="changePage(-1)" class="btn btn-secondary" style="padding: 6px 12px;">上一页</button>
                    <span id="pageInfo" style="font-size: 0.95rem; font-weight: 500;">第 1 页</span>
                    <button id="nextPageBtn" onclick="changePage(1)" class="btn btn-secondary" style="padding: 6px 12px;">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Export Unused Keys -->
    <div id="exportModal" class="modal-overlay">
        <div class="glass-panel modal-content" style="width: 550px;">
            <div class="modal-header">
                <div class="modal-title">导出库存卡密 (未激活)</div>
                <button onclick="closeModal('exportModal')" class="modal-close">&times;</button>
            </div>
            <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                <select id="exportFilterType" class="select-control" style="flex: 1;" onchange="loadExportedKeys()">
                    <option value="">所有类型</option>
                    <option value="trial">仅限 14天测试卡</option>
                    <option value="permanent">仅限 永久正式卡</option>
                </select>
                <button onclick="copyExportedText()" class="btn btn-success">
                    <span>复制全部卡密</span>
                </button>
            </div>
            <div class="form-group">
                <textarea id="exportedKeysText" class="export-textarea" readonly placeholder="加载中..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <button onclick="closeModal('exportModal')" class="btn btn-secondary">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentPage = 1;
        const pageLimit = 25;
        let searchTimeout = null;

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'none';
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (response.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || '请求失败');
                }
                return data;
            } catch (err) {
                showToast(err.message, true);
                return null;
            }
        }

        async function loadMetrics() {
            const data = await apiRequest('/api/agent/metrics');
            if (!data) return;

            document.getElementById('metric-total').innerText = data.assigned_count;
            document.getElementById('metric-active').innerText = data.activated_count;
            document.getElementById('metric-unused').innerText = data.unused_count;
        }

        async function loadLicenses(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchKey').value;
            const status = document.getElementById('filterStatus').value;

            const url = `/api/agent/licenses?page=${page}&limit=${pageLimit}&search=${encodeURIComponent(search)}&status=${status}`;
            const data = await apiRequest(url);
            if (!data) return;

            const tbody = document.getElementById('licensesTableBody');
            tbody.innerHTML = '';

            data.licenses.forEach(l => {
                const tr = document.createElement('tr');
                
                const typeBadge = l.type === 'trial' 
                    ? '<span class="badge badge-trial">14天测试卡</span>' 
                    : '<span class="badge badge-permanent">永久正式卡</span>';
                
                let statusBadge = '';
                if (l.status === 'unused') statusBadge = '<span class="badge badge-unused">未激活</span>';
                else if (l.status === 'active') statusBadge = '<span class="badge badge-active">已激活</span>';
                else if (l.status === 'banned') statusBadge = '<span class="badge badge-banned">已封禁</span>';

                const createdStr = l.created_at ? new Date(l.created_at).toLocaleString() : '-';
                const activatedStr = l.activated_at ? new Date(l.activated_at).toLocaleString() : '-';
                const hwidText = l.hwid ? `<span style="font-family: monospace; font-size: 0.85rem;" title="${l.hwid}">${l.hwid.substring(0, 16)}...</span>` : '-';

                tr.innerHTML = `
                    <td style="font-family: monospace; font-weight: 600; letter-spacing: 0.05em;">${l.key}</td>
                    <td>${typeBadge}</td>
                    <td>${hwidText}</td>
                    <td>${statusBadge}</td>
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${createdStr}</td>
                    <td style="font-size: 0.8rem; color: var(--text-muted);">${activatedStr}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update page display
            document.getElementById('pageInfo').innerText = `第 ${page} 页 / 共 ${Math.ceil(data.total / pageLimit) || 1} 页`;
            document.getElementById('prevPageBtn').disabled = page === 1;
            document.getElementById('nextPageBtn').disabled = page * pageLimit >= data.total;
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadLicenses(1);
            }, 400);
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1) {
                loadLicenses(newPage);
            }
        }

        function openExportModal() {
            openModal('exportModal');
            loadExportedKeys();
        }

        async function loadExportedKeys() {
            const type = document.getElementById('exportFilterType').value;
            const textarea = document.getElementById('exportedKeysText');
            textarea.value = '加载中...';

            const url = `/api/agent/licenses/export?type=${type}`;
            const data = await apiRequest(url);
            if (!data) return;

            if (data.keys.length === 0) {
                textarea.value = '（没有可导出的未激活卡密）';
            } else {
                textarea.value = data.keys.join('\n');
            }
        }

        function copyExportedText() {
            const textarea = document.getElementById('exportedKeysText');
            if (textarea.value.startsWith('（') || textarea.value.startsWith('加载')) {
                showToast('没有有效的卡密可以复制', true);
                return;
            }
            
            textarea.select();
            document.execCommand('copy');
            showToast('已成功复制所有卡密到剪贴板！');
        }

        async function handleLogout() {
            const res = await apiRequest('/api/logout', {method: 'POST'});
            if (res && res.success) {
                window.location.href = '/login';
            }
        }

        // Initialize agent panel
        (async () => {
            const user = await apiRequest('/api/me');
            if (user) {
                if (user.role !== 'agent') {
                    window.location.href = '/login';
                } else {
                    document.getElementById('agentName').innerText = `${user.name} (${user.username})`;
                    loadMetrics();
                    loadLicenses(1);
                }
            }
        })();
    </script>
</body>
</html>
